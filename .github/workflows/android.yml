name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api-level:
        description: Emulator API (33 minimum; 37.0 latest supported)
        default: '33'
        type: choice
        options: ['33', '37.0']

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923' # 20.0
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build application and smoke-test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify committed Room schemas match compiler output
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: Verify clean outputs rebuild with cached dependencies offline
        run: ./gradlew --offline clean :app:assembleDebug :app:assembleDebugAndroidTest

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923' # 20.0
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew :app:lintDebug spotlessCheck :app:dokkaGeneratePublicationHtml

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923' # 20.0
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew :app:testDebugUnitTest

  android-tests:
    name: android-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '14742923' # 20.0
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Room migration, plan creation and UI privacy tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ inputs.api-level || '33' }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell cmd connectivity airplane-mode enable
            ./gradlew :app:connectedDebugAndroidTest || { cat app/build/outputs/androidTest-results/connected/debug/TEST-*.xml; exit 1; }
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class 'com.quantumfighter.gymtracker.CatalogueRelaunchTest#t01ApplicationCatalogueSurvivesProcessRelaunchOffline' -e cataloguePhase seed com.quantumfighter.gymtracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/catalogue-seed.txt
            grep -q 'OK (1 test)' /tmp/catalogue-seed.txt
            adb shell am force-stop com.quantumfighter.gymtracker.debug
            adb shell am start -W -n com.quantumfighter.gymtracker.debug/com.quantumfighter.gymtracker.MainActivity
            adb shell am instrument -w -e class 'com.quantumfighter.gymtracker.CatalogueRelaunchTest#t01ApplicationCatalogueSurvivesProcessRelaunchOffline' -e cataloguePhase verify com.quantumfighter.gymtracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/catalogue-relaunch.txt
            grep -q 'OK (1 test)' /tmp/catalogue-relaunch.txt
            adb shell am instrument -w -e class 'com.quantumfighter.gymtracker.ProgramRelaunchTest#t01SavedRoutineAndHomeSelectionSurviveProcessRestart' -e programPhase seed com.quantumfighter.gymtracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/program-seed.txt
            grep -q 'OK (1 test)' /tmp/program-seed.txt
            adb shell am force-stop com.quantumfighter.gymtracker.debug
            adb shell am start -W -n com.quantumfighter.gymtracker.debug/com.quantumfighter.gymtracker.MainActivity
            adb shell am instrument -w -e class 'com.quantumfighter.gymtracker.ProgramRelaunchTest#t01SavedRoutineAndHomeSelectionSurviveProcessRestart' -e programPhase verify com.quantumfighter.gymtracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/program-relaunch.txt
            grep -q 'OK (1 test)' /tmp/program-relaunch.txt
            adb shell am instrument -w -e class 'com.quantumfighter.gymtracker.WorkoutRelaunchTest#t06CommittedSetsSurviveProcessDeathAndRetry' -e workoutPhase seed com.quantumfighter.gymtracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/workout-seed.txt
            grep -q 'OK (1 test)' /tmp/workout-seed.txt
            adb shell am force-stop com.quantumfighter.gymtracker.debug
            adb shell am start -W -n com.quantumfighter.gymtracker.debug/com.quantumfighter.gymtracker.MainActivity
            adb shell am instrument -w -e class 'com.quantumfighter.gymtracker.WorkoutRelaunchTest#t06CommittedSetsSurviveProcessDeathAndRetry' -e workoutPhase verify com.quantumfighter.gymtracker.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/workout-relaunch.txt
            grep -q 'OK (1 test)' /tmp/workout-relaunch.txt
            python3 scripts/verify_workout_abrupt_kill.py
